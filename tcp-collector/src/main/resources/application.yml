spring:
  application:
    name: tcp-collector
server:
  port: ${SERVER_PORT:8081}
lab:
  transport: ${LAB_TRANSPORT:tcp}
  tcp:
    host: ${TCP_HOST:127.0.0.1}
    port: ${TCP_PORT:9090}
    read-timeout-millis: ${TCP_READ_TIMEOUT_MILLIS:3000}
    aes-key-base64: ${TCP_AES_KEY_BASE64:dFNpAVHJtHE9+1MJH8vfkqJWz15Jy97/}
  # 같은 Client ID로 재접속하면 브로커에 보관된 구독과 메시지를 이어받는다.
  mqtt:
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:lab-collector}
    topic: ${MQTT_TOPIC:lab/devices/+/telemetry}
    qos: ${MQTT_QOS:1}
    clean-session: ${MQTT_CLEAN_SESSION:false}
